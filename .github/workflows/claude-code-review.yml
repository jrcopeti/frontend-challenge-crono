name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    name: Review pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history so the diff against the base branch resolves.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately not the code-review plugin. That skill fans the review
          # out to background agents, and the action's session ends before they
          # report — the job went green having produced no review at all. These
          # instructions run inline in a single session instead.
          prompt: |
            Review this pull request. Read CLAUDE.md first: it records the
            conventions this repository is held to.

            Get the diff with:
              git diff origin/${{ github.event.pull_request.base.ref }}...HEAD

            This repository rebuilds a Figma design as faithfully as possible,
            so weight the review towards:

            - Correctness bugs in React and TypeScript, especially state
              derivation and TanStack Query mutations.
            - Accessibility of interactive components — the signals dropdown,
              the KPI tooltip, and icon-only buttons.
            - Raw hex colour values in component files. Every colour must come
              from a token in src/styles/index.css; a literal hex outside that
              file is a bug.
            - Anything that would visibly diverge from design/Dashboard.png.

            Do the review yourself in this session. Do not spawn subagents and
            do not wait on background tasks.

            Post each finding as an inline comment on the line it concerns,
            using mcp__github_inline_comment__create_inline_comment. Be specific
            and brief; skip praise and style nitpicks that Prettier or ESLint
            already enforce. If nothing is worth flagging, post no comments and
            say so in your final message.
          claude_args: >-
            --allowedTools
            "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
          # The job log is public; the trade is acceptable here, and without it
          # a review that finds nothing is indistinguishable from one that failed.
          show_full_output: true
